openapi: 3.0.3
info:
  title: Booker API
  version: "1.0.0"
  description: >-
    API REST del sistema de gestión de biblioteca Booker. Stack: Node.js +
    Express 5 + Sequelize 6 sobre MySQL. No hay autenticación implementada:
    todos los endpoints son de acceso libre (ver sección security más abajo).
servers:
  - url: http://localhost:3000
    description: Servidor local (puerto fijo definido en index.js)
security: []
tags:
  - name: Autores
  - name: Categorias
  - name: Editoriales
  - name: Ejemplares
  - name: EstadosEjemplar
  - name: EstadosMulta
  - name: EstadosPrestamo
  - name: EstadosReserva
  - name: EstadosUsuario
  - name: Idiomas
  - name: Libros
  - name: Multas
  - name: Notificaciones
  - name: Paises
  - name: Prestamos
  - name: Reservas
  - name: Roles
  - name: TiposDocumento
  - name: TiposNotificacion
  - name: Usuarios

paths:
  # ===================== AUTORES =====================
  /api/autores/:
    get:
      tags: [Autores]
      operationId: listarAutores
      summary: Lista todos los autores
      responses:
        "200":
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Autor"
        "500":
          description: Error al obtener los autores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Autores]
      operationId: crearAutor
      summary: Crea un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Autor"
            example:
              nombre: Gabriel
              apellido: García Márquez
              nacionalidad: Colombiana
              fecha_nacimiento: "1927-03-06"
              biografia: Escritor colombiano, premio Nobel de Literatura 1982.
      responses:
        "201":
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autor"
        "400":
          description: Faltan campos obligatorios o error al crear
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/autores/{id}:
    patch:
      tags: [Autores]
      operationId: editarAutor
      summary: Edita un autor
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Autor"
      responses:
        "200":
          description: Autor actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Error al actualizar el autor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Autor no encontrado o sin cambios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Autores]
      operationId: eliminarAutor
      summary: Elimina un autor
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Autor eliminado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error al eliminar el autor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

