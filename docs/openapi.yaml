components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: ID (PK) del recurso
      schema:
        type: integer
  schemas:
    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
        error:
          type: string
      example:
        mensaje: Error al obtener los autores
        error: detalle técnico del error de Sequelize/MySQL
    MessageResponse:
      type: object
      properties:
        mensaje:
          type: string
      example:
        mensaje: Autor actualizado correctamente

    Autor:
      type: object
      required: [nombre, apellido, nacionalidad, fecha_nacimiento]
      properties:
        id_autor:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 50
        apellido:
          type: string
          maxLength: 30
        nacionalidad:
          type: string
          maxLength: 30
        fecha_nacimiento:
          type: string
          format: date
        biografia:
          type: string
          maxLength: 300
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Categoria:
      type: object
      required: [nombre]
      properties:
        id_categoria:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          maxLength: 100
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Editorial:
      type: object
      required: [nombre_editorial, email]
      properties:
        id_editorial:
          type: integer
          readOnly: true
        nombre_editorial:
          type: string
          maxLength: 100
        telefono:
          type: string
          maxLength: 20
          nullable: true
        email:
          type: string
          maxLength: 30
        pagina_web:
          type: string
          maxLength: 200
          nullable: true
        id_pais:
          type: integer
          nullable: true
          description: FK a Pais (agregada por asociación en relaciones.js)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Ejemplar:
      type: object
      required: [codigo_inventario, ubicacion_estante, fecha_adquisicion, codigo_barras]
      properties:
        id_ejemplar:
          type: integer
          readOnly: true
        codigo_inventario:
          type: string
          maxLength: 20
        ubicacion_estante:
          type: string
          maxLength: 30
        fecha_adquisicion:
          type: string
          format: date
        codigo_barras:
          type: string
          maxLength: 50
        id_libro:
          type: integer
          nullable: true
          description: FK a Libro (agregada por asociación en relaciones.js)
        id_estado_ejemplar:
          type: integer
          nullable: true
          description: FK a EstadoEjemplar (agregada por asociación en relaciones.js)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    EstadoEjemplar:
      type: object
      required: [nombre_estado]
      properties:
        id_estado_ejemplar:
          type: integer
          readOnly: true
        nombre_estado:
          type: string
          maxLength: 30
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    EstadoMulta:
      type: object
      required: [nombre_estado]
      properties:
        id_estado_multa:
          type: integer
          readOnly: true
        nombre_estado:
          type: string
          maxLength: 30
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    EstadoPrestamo:
      type: object
      required: [nombre_estado]
      properties:
        id_estado_prestamo:
          type: integer
          readOnly: true
        nombre_estado:
          type: string
          maxLength: 30
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    EstadoReserva:
      type: object
      required: [nombre_estado]
      properties:
        id_estado_reserva:
          type: integer
          readOnly: true
        nombre_estado:
          type: string
          maxLength: 30
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    EstadoUsuario:
      type: object
      required: [nombre_estado_usuario]
      properties:
        id_estado_usuario:
          type: integer
          readOnly: true
        nombre_estado_usuario:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Idioma:
      type: object
      required: [nombre]
      properties:
        id_idioma:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 30
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Libro:
      type: object
      required: [titulo, isbn, anio_publicacion, num_paginas]
      properties:
        id_libro:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 150
        isbn:
          type: string
          maxLength: 17
        anio_publicacion:
          type: integer
        num_paginas:
          type: integer
        sinopsis:
          type: string
          maxLength: 200
          nullable: true
        id_editorial:
          type: integer
          nullable: true
          description: FK a Editorial (agregada por asociación en relaciones.js)
        id_idioma:
          type: integer
          nullable: true
          description: FK a Idioma (agregada por asociación en relaciones.js)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    LibroAutor:
      type: object
      description: Fila de la tabla intermedia Libro_Autor (sin timestamps).
      properties:
        id_libro:
          type: integer
        id_autor:
          type: integer

    LibroCategoria:
      type: object
      description: Fila de la tabla intermedia Libro_Categoria (sin timestamps).
      properties:
        id_libro:
          type: integer
        id_categoria:
          type: integer

    Multa:
      type: object
      required: [id_prestamo, id_estado_multa, monto, motivo, fecha_generada]
      properties:
        id_multa:
          type: integer
          readOnly: true
        id_prestamo:
          type: integer
          description: FK a Prestamo
        id_estado_multa:
          type: integer
          description: FK a EstadoMulta
        monto:
          type: number
          format: double
          description: DECIMAL(10,2) en la base de datos
        motivo:
          type: string
          maxLength: 100
        fecha_generada:
          type: string
          format: date
        fecha_pago:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Notificacion:
      type: object
      required: [id_cliente, id_tipo_notificacion, mensaje, fecha_envio]
      properties:
        id_notificacion:
          type: integer
          readOnly: true
        id_cliente:
          type: integer
          description: FK a Usuario
        id_tipo_notificacion:
          type: integer
          description: FK a TipoNotificacion
        mensaje:
          type: string
          maxLength: 200
        referencia_id:
          type: integer
          nullable: true
        tipo_referencia:
          type: string
          maxLength: 30
          nullable: true
        fecha_envio:
          type: string
          format: date-time
        leida:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Pais:
      type: object
      required: [nombre_pais]
      properties:
        id_pais:
          type: integer
          readOnly: true
        nombre_pais:
          type: string
          maxLength: 30
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Prestamo:
      type: object
      required:
        - id_ejemplar
        - id_cliente
        - id_registrado_por
        - id_estado_prestamo
        - fecha_prestamo
        - fecha_devolucion_esperada
      properties:
        id_prestamo:
          type: integer
          readOnly: true
        id_ejemplar:
          type: integer
          description: FK a Ejemplar
        id_cliente:
          type: integer
          description: FK a Usuario (alias "cliente")
        id_registrado_por:
          type: integer
          description: FK a Usuario (alias "registradoPor")
        id_estado_prestamo:
          type: integer
          description: FK a EstadoPrestamo
        fecha_prestamo:
          type: string
          format: date
        fecha_devolucion_esperada:
          type: string
          format: date
        fecha_devolucion_real:
          type: string
          format: date
          nullable: true
        observaciones:
          type: string
          maxLength: 100
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Reserva:
      type: object
      required: [id_libro, id_cliente, id_estado_reserva, fecha_reserva, fecha_expiracion]
      properties:
        id_reserva:
          type: integer
          readOnly: true
        id_libro:
          type: integer
          description: FK a Libro
        id_cliente:
          type: integer
          description: FK a Usuario
        id_estado_reserva:
          type: integer
          description: FK a EstadoReserva
        fecha_reserva:
          type: string
          format: date
        fecha_expiracion:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
